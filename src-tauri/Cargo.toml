[package]
name = "litechat"
version = "0.1.0"
description = "A lightweight chat shell"
authors = ["LiteChat"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "charset"] }
futures-util = "0.3"
regex = "1"
base64 = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
calamine = "0.38"
pdf-extract = "0.12"
lopdf = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }

tokio = { version = "1", features = ["sync", "process", "io-util", "rt", "time"] }
rmcp = { version = "3", default-features = false, features = [
    "client",
    "transport-child-process",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 不用 panic = "abort"：pdf-extract 遇到不支持的字体编码会 panic，
# 需要 catch_unwind 兜住，否则 release 版会直接闪退。
codegen-units = 1
lto = true
opt-level = "s"
strip = true
