[package]
name = "litechat"
version = "0.1.0"
description = "A lightweight chat shell"
authors = ["LiteChat"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "charset"] }
futures-util = "0.3"
regex = "1"
base64 = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
calamine = "0.38"
# PDF 文字提取：pdfium 对中文 PDF 的编码支持远好于 pdf-extract
pdfium-render = "0.9"
# PDF 内嵌图片：pdfium 不导出原始图像流，这里直接读对象树
lopdf = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }

tokio = { version = "1", features = ["sync", "process", "io-util", "rt", "time"] }
rmcp = { version = "3", default-features = false, features = [
    "client",
    "transport-child-process",
] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 不用 panic = "abort"：第三方解析库（如 PDF、表格）可能 panic，
# 保留 unwind 才能让单个文件的解析失败不至于终止整个进程。
codegen-units = 1
lto = true
opt-level = "s"
strip = true
