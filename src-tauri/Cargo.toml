[package]
name = "litechat"
version = "0.1.0"
description = "A lightweight chat shell"
authors = ["LiteChat"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "charset"] }
futures-util = "0.3"
regex = "1"

tokio = { version = "1", features = ["sync", "process", "io-util", "rt", "time"] }
rmcp = { version = "3", default-features = false, features = [
    "client",
    "transport-child-process",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
